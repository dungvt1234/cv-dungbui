<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7f3"/>
      <stop offset="1" stop-color="#e8f0ea"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d7a4f"/>
      <stop offset="1" stop-color="#2e9e68"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="900" fill="url(#bg)"/>
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#0e3b2e"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Soyzi — Theo dõi tài chính</text>
  <text x="1180" y="45" font-family="Arial, sans-serif" font-size="16" fill="#9fd4b8" text-anchor="end">Doanh thu • Chi phí • Lợi nhuận</text>
  <!-- KPI cards -->
  <rect x="40" y="100" width="370" height="120" rx="14" fill="#ffffff" stroke="#d9e6dd"/>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="15" fill="#5b6b62">DOANH THU THÁNG</text>
  <text x="70" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1d7a4f">48.500.000 ₫</text>
  <text x="70" y="208" font-family="Arial, sans-serif" font-size="13" fill="#2e9e68">▲ +12% so với tháng trước</text>

  <rect x="440" y="100" width="370" height="120" rx="14" fill="#ffffff" stroke="#d9e6dd"/>
  <text x="470" y="140" font-family="Arial, sans-serif" font-size="15" fill="#5b6b62">CHI PHÍ THÁNG</text>
  <text x="470" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">21.300.000 ₫</text>
  <text x="470" y="208" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">= 43.9% doanh thu</text>

  <rect x="840" y="100" width="370" height="120" rx="14" fill="#ffffff" stroke="#d9e6dd"/>
  <text x="870" y="140" font-family="Arial, sans-serif" font-size="15" fill="#5b6b62">LỢI NHUẬN THÁNG</text>
  <text x="870" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0e3b2e">27.200.000 ₫</text>
  <text x="870" y="208" font-family="Arial, sans-serif" font-size="13" fill="#1d7a4f">ROI 56.1% 🎯</text>

  <!-- Chart -->
  <rect x="40" y="250" width="770" height="580" rx="14" fill="#ffffff" stroke="#d9e6dd"/>
  <text x="70" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0e3b2e">Doanh thu &amp; Chi phí 6 tháng</text>
  <!-- Bars -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#5b6b62">
    <text x="110" y="800" text-anchor="middle">T3</text>
    <text x="220" y="800" text-anchor="middle">T4</text>
    <text x="330" y="800" text-anchor="middle">T5</text>
    <text x="440" y="800" text-anchor="middle">T6</text>
    <text x="550" y="800" text-anchor="middle">T7</text>
    <text x="660" y="800" text-anchor="middle">T8</text>
  </g>
  <rect x="80" y="540" width="55" height="230" rx="6" fill="url(#bar1)"/>
  <rect x="165" y="500" width="55" height="270" rx="6" fill="url(#bar1)"/>
  <rect x="250" y="470" width="55" height="300" rx="6" fill="url(#bar1)"/>
  <rect x="335" y="430" width="55" height="340" rx="6" fill="url(#bar1)"/>
  <rect x="420" y="400" width="55" height="370" rx="6" fill="url(#bar1)"/>
  <rect x="505" y="360" width="55" height="410" rx="6" fill="url(#bar1)"/>
  <rect x="110" y="620" width="55" height="150" rx="6" fill="#e67e22" opacity="0.75"/>
  <rect x="195" y="590" width="55" height="180" rx="6" fill="#e67e22" opacity="0.75"/>
  <rect x="280" y="570" width="55" height="200" rx="6" fill="#e67e22" opacity="0.75"/>
  <rect x="365" y="540" width="55" height="230" rx="6" fill="#e67e22" opacity="0.75"/>
  <rect x="450" y="520" width="55" height="250" rx="6" fill="#e67e22" opacity="0.75"/>
  <rect x="535" y="490" width="55" height="280" rx="6" fill="#e67e22" opacity="0.75"/>
  <rect x="600" y="590" width="120" height="36" rx="8" fill="#1d7a4f"/>
  <text x="660" y="614" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">Doanh thu</text>
  <rect x="600" y="640" width="120" height="36" rx="8" fill="#e67e22" opacity="0.85"/>
  <text x="660" y="664" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">Chi phí</text>

  <!-- Right panel: breakdown -->
  <rect x="840" y="250" width="370" height="580" rx="14" fill="#ffffff" stroke="#d9e6dd"/>
  <text x="870" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0e3b2e">Cơ cấu chi phí</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="870" y="320" width="310" height="26" rx="6" fill="#1d7a4f"/>
    <text x="1180" y="339" fill="#fff" text-anchor="end" font-size="13">Nguyên liệu 38%</text>
    <rect x="870" y="356" width="210" height="26" rx="6" fill="#2e9e68"/>
    <text x="1180" y="375" fill="#fff" text-anchor="end" font-size="13">Nhân công 26%</text>
    <rect x="870" y="392" width="140" height="26" rx="6" fill="#e67e22"/>
    <text x="1180" y="411" fill="#fff" text-anchor="end" font-size="13">Bao bì 17%</text>
    <rect x="870" y="428" width="95" height="26" rx="6" fill="#8e44ad"/>
    <text x="1180" y="447" fill="#fff" text-anchor="end" font-size="13">Khác 12%</text>
  </g>
  <text x="870" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0e3b2e">Sản phẩm bán chạy</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="870" y="535" fill="#0e3b2e">1. Panna cotta dừa</text>
    <text x="1180" y="535" fill="#1d7a4f" text-anchor="end" font-weight="bold">31%</text>
    <text x="870" y="570" fill="#0e3b2e">2. Sữa chua việt quất</text>
    <text x="1180" y="570" fill="#1d7a4f" text-anchor="end" font-weight="bold">24%</text>
    <text x="870" y="605" fill="#0e3b2e">3. Panna cotta xoài</text>
    <text x="1180" y="605" fill="#1d7a4f" text-anchor="end" font-weight="bold">18%</text>
  </g>
</svg>
